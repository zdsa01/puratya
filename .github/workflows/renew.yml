name: Puratya Auto Renew

on:
  # 允许在 GitHub Actions 页面手动触发工作流（用于测试）
  workflow_dispatch:
  # 定时任务：每天 UTC 时间早上 2:00 运行（对应北京时间早上 10:00）
  schedule:
    - cron: '0 2 * * *'

jobs:
  renew_script:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码库
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装所需的第三方依赖及浏览器内核
        run: |
          python -m pip install --upgrade pip
          # 修复 ModuleNotFoundError，同时安装两个依赖
          pip install playwright requests
          # 安装 Chromium 及其所需的系统级依赖 (关键修复步骤)
          playwright install chromium --with-deps

      - name: ▶️ 运行自动续期脚本
        env:
          # 从 GitHub Secrets 中读取你的账号密码和 TG 配置
          PURATYA_USER: ${{ secrets.PURATYA_USER }}
          PURATYA_PASS: ${{ secrets.PURATYA_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew.py
