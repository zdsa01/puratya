name: Puratya Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'  # 每天定时运行
  workflow_dispatch:      # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: 安装 Playwright 浏览器及其系统依赖
        run: |
          playwright install chromium --with-deps

      - name: 执行续期脚本
        env:
          PURATYA_USER: ${{ secrets.PURATYA_USER }}
          PURATYA_PASS: ${{ secrets.PURATYA_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python renew.py
