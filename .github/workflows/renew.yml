name: Puratya Cloud Auto Renew

on:
  schedule:
    # 每 2 天运行一次，防止 167 小时倒计时到期
    - cron: '0 0 */2 * *'
  workflow_dispatch: # 支持网页手动点击运行

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Renewal Script
        env:
          PURATYA_USER: ${{ secrets.PURATYA_USER }}
          PURATYA_PASS: ${{ secrets.PURATYA_PASS }}
        run: python renew.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
